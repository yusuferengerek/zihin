site_name: zihin
site_description: A research harness for skill and failure memory experiments on AppWorld.
site_url: https://yusuferengerek.github.io/zihin/
# scripts/build_site.py copies the tracked tree here, so every relative link between
# documents resolves exactly as it does in the repository.
docs_dir: site-src
site_dir: site
strict: true
theme:
  name: material
  features:
    - navigation.sections
nav:
  - Overview: README.md
  - Question and design:
      - Problem definition: docs/01-problem-definition.en.md
      - Research question: docs/02-research-question.en.md
      - Architecture: docs/03-architecture.en.md
      - Threat model: docs/04-threat-model.en.md
      - Experiment design: docs/05-experiment-design.en.md
      - Skill language: docs/06-skill-language.en.md
      - Failure taxonomy: docs/07-failure-taxonomy.en.md
      - Setup protocol: experiments/setup-protocol.en.md
      - Sandbox scope: docs/12-sandbox-scope.en.md
      - Alternatives ledger: docs/14-alternatives-ledger.en.md
      - Axis extension: docs/reports/eksen-uzatma.en.md
  - Limitations: docs/09-limitations.en.md
  - Reproduce: REPRODUCE.md
  - Data model: DATA_MODEL.md
  - Skill spec: SKILL_SPEC.md
  - Provenance: PROVENANCE.md
  - Turkish documents:
      - CHANGELOG.md
      - PILOT_REPORT.md
      - PROJECT_STATUS.md
      - PULL_REQUESTS.md
