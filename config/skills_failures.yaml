# Koşul: skills_failures — her iki kart türü de gerçek.
# Tam mekanizma.
condition: skills_failures

skills:
  source: standard

failures:
  source: standard

retrieval:
  mode: symbolic
  # Declared 25 September 2026 (preregistration A.4, K-175): a skill card must be
  # expected to save at least one model call. The same in every condition, so no
  # contrast carries it.
  min_expected_saving: 1

shield:
  enabled: true

fill:
  enabled: true

cards:
  skill_slots: 5
  failure_slots: 5
